[package]
name = "execution-engine"
version = "0.1.0"
edition = "2021"

# cdylib -> compiles to WASM for the browser demo (wasm-pack build --target web)
# rlib   -> linked into a native binary/service for the Python-facing bridge
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
